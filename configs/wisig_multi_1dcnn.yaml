dataset:
  name: wisig
  path: src/datasets/WiSig/ManySig.pkl
  output_dir: datasets/wisig
  window_length: 256
  channels: 4
  channel_mode: iqmp
  max_classes: 8
  max_windows_per_source: 256
  output_dtype: float32
  normalize: true
  split:
    protocol: grouped_stratified_by_label_and_distance
    train: 0.7
    val: 0.1
    test: 0.2
  batch_size: 32
  seed: 42

model:
  name: cnn1d_multi
  classes: 8
  in_channels: 4

training:
  learning_rate: 0.003
  epochs: 40
  output_dir: results/wisig_multi_1dcnn