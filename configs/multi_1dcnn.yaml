dataset:
  name: oracle
  path: src/datasets/ORACLE/dataset1/neu_m044q5210
  output_dir: datasets/oracle_multi
  window_length: 64
  channels: 4
  channel_mode: iqmp
  max_classes: 8
  max_windows_per_source: 64

  output_dtype: float64
  normalize: true
  split:
    protocol: grouped_stratified_by_label_and_distance
    train: 0.7
    val: 0.1
    test: 0.2
  batch_size: 32
  seed: 42

model:
  name: cnn1d_multi
  classes: 8
  in_channels: 4

training:
  learning_rate: 0.003
  epochs: 40
  output_dir: results/oracle_multi_1dcnn