dataset:
  name: oracle
  path: src/datasets/ORACLE/dataset1/neu_m044q5210
  window_length: 32
  channels: 4
  channel_mode: iqmp
  max_classes: 2
  max_windows_per_recording: 64
  output_dtype: float64
  normalize: true
  split:
    protocol: grouped_stratified_by_label_and_distance
    train: 0.7
    val: 0.1
    test: 0.2
  batch_size: 32
  seed: 42

model:
  name: cnn1d_multi
  classes: 2
  in_channels: 4

training:
  learning_rate: 0.003
  epochs: 500
  output_dir: results/multi_1dcnn